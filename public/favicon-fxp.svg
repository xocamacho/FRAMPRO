<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="white"/>
  <defs>
    <linearGradient id="gX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7a1a"/>
      <stop offset="100%" style="stop-color:#5cbf2a"/>
    </linearGradient>
    <linearGradient id="gFP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#155a15"/>
      <stop offset="100%" style="stop-color:#1e8c1e"/>
    </linearGradient>
  </defs>

  <!-- Swoosh lines -->
  <path d="M60 340 Q200 310 460 330" stroke="#5cbf2a" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M60 360 Q200 328 460 350" stroke="#5cbf2a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- F -->
  <text x="40" y="300" font-family="Arial Black, sans-serif" font-weight="900" font-size="260" fill="url(#gFP)" font-style="italic">F</text>

  <!-- X -->
  <text x="155" y="300" font-family="Arial Black, sans-serif" font-weight="900" font-size="260" fill="url(#gX)" font-style="italic">X</text>

  <!-- P -->
  <text x="330" y="300" font-family="Arial Black, sans-serif" font-weight="900" font-size="260" fill="url(#gX)" font-style="italic">P</text>

  <!-- Pixel dots bottom right -->
  <rect x="420" y="330" width="22" height="22" fill="#5cbf2a" rx="2"/>
  <rect x="448" y="330" width="16" height="16" fill="#5cbf2a" rx="2"/>
  <rect x="420" y="358" width="16" height="16" fill="#5cbf2a" rx="2"/>
  <rect x="442" y="356" width="10" height="10" fill="#5cbf2a" rx="2"/>
  <rect x="458" y="352" width="8" height="8" fill="#5cbf2a" rx="2" opacity="0.6"/>
  <rect x="466" y="342" width="12" height="12" fill="#5cbf2a" rx="2"/>
</svg>
